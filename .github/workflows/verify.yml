name: Verify public resources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for path in Path('.').rglob('*.pem'):
              text = path.read_text()
              assert text.startswith('-----BEGIN PUBLIC KEY-----'), str(path)
              assert 'PRIVATE KEY' not in text, str(path)
              subprocess.run(['openssl', 'pkey', '-pubin', '-in', str(path), '-noout'], check=True)
          PY
